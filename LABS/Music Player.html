<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player App</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #7c3aed;
            --bg-start: #4f46e5;
            --bg-end: #7c3aed;
            --surface: rgba(255, 255, 255, 0.9);
            --muted: #64748b;
            --text: #0f172a;
            --radius: 14px;
            --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.12);
            --space: 16px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--space) * 1.5);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 560px;
            padding: calc(var(--space) * 2);
            border-radius: calc(var(--radius) * 1.2);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(6px);
        }

        .container>*+* {
            margin-top: 1rem;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.6rem;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .song {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.5));
            border-radius: 12px;
            transition: transform 240ms ease, box-shadow 240ms ease;
        }

        .song:focus-within,
        .song:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.12);
        }

        .song h2 {
            font-size: 1rem;
            margin: 0 0 4px 0;
            color: #0b1220;
        }

        .meta {
            font-size: 0.9rem;
            color: var(--muted);
            margin: 0;
        }

        .info {
            flex: 1 1 auto;
        }

        audio {
            width: 100%;
            margin-top: 8px;
            accent-color: var(--accent);
            outline: none;
        }

        /* focus styles for accessibility */
        :focus-visible {
            outline: 3px solid rgba(99, 102, 241, 0.18);
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .song {
                flex-direction: column;
                align-items: stretch;
            }

            .container {
                padding: calc(var(--space) * 1.25);
            }

            h1 {
                font-size: 1.4rem;
            }
        }

        /* Respect user motion preferences */
        @media (prefers-reduced-motion: reduce) {

            .song,
            .song:hover,
            .song:focus-within {
                transition: none;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tunes</h1>
        <div class="song">
            <h2>Can't Stay Down</h2>
            <p>Artist: Quincy Larson</p>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3" loop
                controls></audio>
        </div>

        <div class="song">
            <h2>Cruising for a Musing</h2>
            <p>Artist: Quincy Larson</p>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" loop
                controls></audio>
        </div>

        <div class="song">
            <h2>Scratching the Surface</h2>
            <p>Artist: Quincy Larson</p>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/scratching-the-surface.mp3" loop
                controls></audio>
        </div>
    </div>
</body>

</html>
