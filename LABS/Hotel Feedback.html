<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hotel Feedback Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        main {
            width: min(90%, 700px);
            margin: 3rem auto;
        }

        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --background: #f5f7fb;
            --surface: #ffffff;
            --text: #222;
            --border: #d1d5db;
            --radius: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }


        header p {
            color: #666;
        }

        form {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        fieldset {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        legend {
            padding: 0 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.2);
        }

        input:valid {
            border-color: #22c55e;
        }

        input:invalid:not(::placeholder-shown) {
            border-color: #ef4444;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 0.5rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            accent-color: var(--primary);
        }

        input[type="radio"]+label,
        input[type="checkbox"]+label {
            display: inline;
            margin-right: 1.5rem;
            cursor: pointer;
        }

        input[type="radio"]:hover,
        input[type="checkbox"]:hover {
            transform: scale(1.1);
        }

        input[type="radio"],
        input[type="checkbox"] {
            transition: transform 0.2s ease;
        }

        button {
            width: 100%;
            pp: 0.9rem;
            border: none;
            border-radius: var(--radius);
            background-color: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
        }

        ::placeholder {
            font-style: italic;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <header>
        <h1>Hotel Feedback Form</h1>
        <p>
            Thank you for staying with us. Please provide feedback on your recent
            stay.
        </p>
    </header>
    <main>
        <form method="POST" action="https://hotel-feedback.freecodecamp.org">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="full-name">Name (required):</label>
                <input type="text" id="full-name" name="name" placeholder="e.g., John Doe" required size="20">

                <label for="email">Email address (required):</label>
                <input placeholder="example@email.com" required id="email" type="email" name="email" size="20" />
                <label for="age">Age (optional):</label>
                <input type="number" name="age" id="age" min="3" max="100" />
            </fieldset>

            <fieldset>
                <legend>Was this your first time at our hotel?</legend>
                <input id="yes-option" type="radio" name="hotel-stay" value="yes" />
                <label for="yes-option">Yes</label>
                <input id="no-option" type="radio" name="hotel-stay" value="no" />
                <label for="no-option">No</label>
            </fieldset>

            <fieldset>
                <legend>
                    Why did you choose to stay at our hotel? (Check all that apply)
                </legend>

                <input type="checkbox" id="ads" name="choice" value="ads" />
                <label for="ads">Social Media Ads</label>

                <input type="checkbox" id="recommendation" name="choice" value="recommendation" />
                <label for="recommendation">Personal Recommendation</label>

                <input type="checkbox" id="location" name="choice" value="location" />
                <label for="location">Location</label>

                <input type="checkbox" id="reputation" name="choice" value="reputation" />
                <label for="reputation">Reputation</label>

                <input type="checkbox" id="price" name="choice" value="price" />
                <label for="price">Price</label>
            </fieldset>

            <fieldset>
                <legend>Ratings</legend>

                <label for="service">How was the service?</label>

                <select name="service" id="service">
                    <option value="poor">Poor</option>
                    <option value="satisfactory">Satisfactory</option>
                    <option value="good">Good</option>
                    <option value="very-good">Very Good</option>
                    <option selected value="excellent">Excellent</option>
                </select>

                <label for="food">How was the food?</label>

                <select name="food" id="food">
                    <option value="poor">Poor</option>
                    <option value="satisfactory">Satisfactory</option>
                    <option value="good">Good</option>
                    <option value="very-good">Very Good</option>
                    <option value="excellent" selected>Excellent</option>
                </select>

                <label for="comments">Other Comments?</label>
                <textarea id="comments" name="comments" cols="30" rows="10"></textarea>
                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </main>
</body>

</html>
